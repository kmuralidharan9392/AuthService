plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
}

group = 'com.preva'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Enforce the Spring Boot BOM version natively through Gradle's platform feature
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.4.1')
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:3.4.1')

    // Spring Boot Web MVC Layer (Versions are pulled from the platform BOM)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Official Enhanced AWS SDK v2 for Cognito Identity Provider
    // (AWS SDK version is explicitly kept since it isn't managed by the Spring BOM)
    implementation 'software.amazon.awssdk:cognitoidentityprovider:2.29.0'

    // Lombok (Versions are pulled from the platform BOM)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
